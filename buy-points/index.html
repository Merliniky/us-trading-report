<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投资买点</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mute:#6b7280;--line:#e5e7eb;--up:#0a8f4e;--dn:#d0342c;--acc:#2563eb;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--fg:#e6e9ef;--mute:#9aa3b2;--line:#2a303b;--up:#34c77b;--dn:#ff6b62;--acc:#6ea0ff;--chip:#1f2638}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:16px;margin:0 0 10px}h3{font-size:16px;margin:0;font-weight:600}
.sub{color:var(--mute);font-size:12.5px}.badge{display:inline-block;background:#f59e0b;color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;margin-left:6px;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card.callout{border-color:#f59e0b}.hit{border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--mute)}
.up{color:var(--up)}.dn{color:var(--dn)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mute);font-weight:500;background:var(--card)}
th:first-child,td:first-child{text-align:left}
td.wrap{white-space:normal;text-align:left;min-width:160px}
tr.hitrow td{background:var(--chip)}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;font-size:12px}
ul{margin:4px 0;padding-left:20px}li{margin:3px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank{display:inline-block;min-width:1.4em;color:var(--acc);font-variant-numeric:tabular-nums}
.px{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sum{margin:8px 0}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;margin:0 6px 6px 0;border:1px solid transparent;vertical-align:middle}
.tag.on{background:var(--acc);color:#fff}.tag.off{background:var(--chip);color:var(--fg);border-color:var(--line)}.tag.miss{background:#f59e0b;color:#fff}
td .tag{margin:0 0 0 6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--acc);color:#fff;text-decoration:none;font-size:13px;line-height:1.45}
.pill.off{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
a.pill:visited{color:#fff}a.pill.off:visited{color:var(--fg)}
article.card{scroll-margin-top:12px}
details{border-top:1px solid var(--line);padding:6px 0;margin-top:8px}summary{cursor:pointer}
.foot{color:var(--mute);font-size:12px;text-align:center;margin:20px 0}
.foot a{color:var(--acc)}
</style>
</head>
<body><div class="wrap">
<nav class="seg" id="sitetabs" style="margin:2px 0 10px"><a href="../index.html" style="display:inline-block;padding:3px 12px;border-radius:6px;font-size:13px;text-decoration:none;background:var(--card);color:var(--fg);border:1px solid var(--line)">美股</a> <a href="../ashare/index.html" style="display:inline-block;padding:3px 12px;border-radius:6px;font-size:13px;text-decoration:none;background:var(--card);color:var(--fg);border:1px solid var(--line)">A股</a> <a href="./index.html" style="display:inline-block;padding:3px 12px;border-radius:6px;font-size:13px;text-decoration:none;background:var(--acc);color:#fff;border:1px solid var(--acc)">投资买点</a></nav>
<script src="../assets/sitetabs.js"></script>
<h1>投资买点 <span class="badge" id="badge">周报</span></h1>
<div class="sub" id="meta">正在读取本周数据…</div>
<div id="app"></div>
<div class="foot" id="foot">仅供研究参考，不构成投资建议。时间均为北京时间。</div>
</div>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MA_ORDER=["sma5w","sma26w","sma5m","sma5q","sma60m","sma5y"];
const TYPE_MA={sma5w_in_uptrend:"sma5w",pullback_to_sma26w:"sma26w",sma5m:"sma5m",sma5q:"sma5q",sma60m:"sma60m",sma5y:"sma5y"};
const TYPE_LABEL={sma5w_in_uptrend:"上升趋势中的 5 周线",pullback_to_sma26w:"回调到 26 周线",sma5m:"5 月线",sma5q:"5 季线",sma60m:"5 年线",sma5y:"年线 SMA5（对照）"};
const LABELS={
  priceSeries:"价格序列",sma5w:"5 周线",sma26w:"26 周线（半年线）",sma5m:"5 月线",sma5q:"5 季线（约 15 个月）",sma60m:"5 年线（月线 SMA60）",sma5y:"年线 SMA5（对照，不单独作为买点）",
  sma5wRising:"5 周线向上",sma26wRising:"26 周线向上",sma5mRising:"5 月线向上",sma5qRising:"5 季线向上",sma60mRising:"5 年线向上",
  uptrendForSma5wBuy:"5 周线买点要求的上升趋势",bandPct:"接近阈值（%）",closeWithinBand:"收盘落在阈值内",weekTagAndHold:"周内接近后站稳",
  midTermA:"中期：26 周线",midTermB:"中期：上升趋势中的 5 周线",longTerm:"长期",ranking:"排序",spacexRule:"上市时间较短的代码（SPCX）"
};

function money(x){
  if(x==null||x==="")return null;
  const n=Number(x);
  if(!isFinite(n))return null;
  return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function ccy(code){return !code||code==="USD"?"美元":String(code)}
function bandText(b){
  const n=Number(b);
  if(!isFinite(n))return "2";
  return n%1===0?String(n):String(Math.round(n*10)/10);
}
function domId(prefix,ticker){return prefix+"-"+String(ticker).replace(/[^A-Za-z0-9_-]/g,"-")}
function sorted(list){
  return (list||[]).map((x,i)=>({x,i})).sort((a,b)=>{
    const ra=a.x.rank==null?1e9:Number(a.x.rank), rb=b.x.rank==null?1e9:Number(b.x.rank);
    return ra-rb||a.i-b.i;
  }).map(t=>t.x);
}
function sideTypes(side){
  if(!side)return [];
  if(side.types&&side.types.length)return side.types.slice();
  return side.type?[side.type]:[];
}
function typeText(side){
  return sideTypes(side).map(t=>TYPE_LABEL[t]||t).join("、");
}
function hitKeys(it){
  const keys=[];
  [["midTerm"],["longTerm"]].forEach(pair=>{
    const side=it[pair[0]];
    if(!side||!side.triggered)return;
    sideTypes(side).forEach(t=>{if(TYPE_MA[t])keys.push(TYPE_MA[t])});
  });
  return keys;
}
function triggered(it){return !!((it.midTerm&&it.midTerm.triggered)||(it.longTerm&&it.longTerm.triggered))}
function hitLabel(it){
  const parts=[];
  if(it.midTerm&&it.midTerm.triggered)parts.push("中期 "+typeText(it.midTerm));
  if(it.longTerm&&it.longTerm.triggered)parts.push("长期 "+typeText(it.longTerm));
  return parts.join(" · ");
}
function maName(it,key){
  const m=it.mas&&it.mas[key];
  if(m&&m.name)return m.name;
  return LABELS[key]||key;
}
function distCell(pct){
  if(pct==null||pct==="")return "—";
  const n=Number(pct);
  if(!isFinite(n))return "—";
  const cls=n>0?"up":n<0?"dn":"";
  const text=(n>0?"+":"")+n.toFixed(2)+"%";
  return `<span class="${cls}">${text}</span>`;
}
function dirCell(rising){
  if(rising==null)return "—";
  return rising?'<span class="up">向上</span>':'<span class="dn">向下</span>';
}
function dl(obj){
  if(obj==null)return "";
  if(typeof obj!=="object")return `<p>${esc(obj)}</p>`;
  return "<ul>"+Object.keys(obj).map(k=>{
    let v=obj[k];
    if(v&&typeof v==="object")v=JSON.stringify(v);
    return `<li><b>${esc(LABELS[k]||k)}。</b> ${esc(v)}</li>`;
  }).join("")+"</ul>";
}
function pill(it,prefix){
  const id=domId(prefix,it.ticker);
  const on=triggered(it);
  const text=esc((it.rank==null?"":it.rank+" ")+it.name+" "+it.ticker)+" · "+esc(on?hitLabel(it):"本周没有买点");
  return `<a class="pill${on?"":" off"}" href="#${id}">${text}</a>`;
}
function listingBlock(it){
  const n=it.listingNote;
  if(!n)return "";
  const insuff=(n.insufficientAverages||[]).map(k=>maName(it,k));
  const bits=[];
  bits.push(`<b>${esc(it.name)}（代码 ${esc(it.ticker)}）按上市公司处理。</b>`);
  if(n.listingDate)bits.push(`${esc(n.listingDate)} 上市`);
  if(n.exchange)bits.push(`（${esc(n.exchange)}）`);
  if(n.ipoPriceUsd!=null)bits.push(`，发行价 ${esc(money(n.ipoPriceUsd))} 美元`);
  if(n.settlementDate)bits.push(`，${esc(n.settlementDate)} 完成交割`);
  bits.push("。价格用公开交易的收盘价，不用未上市估值。");
  if(insuff.length)bits.push(`历史不足、暂不给出的均线：${esc(insuff.join("、"))}。均线只能从上市日起的行情计算，不拼接、不编造。`);
  if(n.historyRule)bits.push(esc(n.historyRule)+"。");
  bits.push("本页不绘制价格走势图，不会把同代码旧证券的历史 K 线画进来。");
  return `<div class="card callout" style="margin:10px 0">${bits.join("")}</div>`;
}
function maTable(it){
  const mas=it.mas||{};
  const hits={};
  hitKeys(it).forEach(k=>{hits[k]=1});
  const keys=MA_ORDER.filter(k=>mas[k]).concat(Object.keys(mas).filter(k=>MA_ORDER.indexOf(k)<0));
  const rows=keys.map(key=>{
    const m=mas[key]||{};
    const note=m.note?`<div class="sub">${esc(m.note)}</div>`:"";
    const enough=m.enoughHistory!==false&&m.value!=null;
    const value=enough?esc(money(m.value))+note:"历史不足"+note;
    let name=esc(m.name||LABELS[key]||key);
    if(hits[key])name+=` <span class="tag on">触发</span>`;
    if(key==="sma5y")name+=` <span class="tag off">对照</span>`;
    return `<tr class="${hits[key]?"hitrow":""}"><td>${name}</td><td class="${note?"wrap":""}">${value}</td><td>${enough?dirCell(m.rising):"—"}</td><td>${enough?distCell(m.distancePct):"—"}</td></tr>`;
  }).join("");
  return `<div class="tw"><table><tr><th>均线</th><th>数值（${esc(ccy(it.currency))}）</th><th>方向</th><th>收盘距离</th></tr>${rows}</table></div><p class="sub">距离 = 收盘相对该均线的百分比，正数表示收盘在均线之上。标成「触发」的是本周买点用到的那条线。</p>`;
}
function sampleLine(it){
  const h=it.history;
  if(!h)return "";
  const start=h.firstDateUsed?`自 ${esc(h.firstDateUsed)} 起`:"";
  return `<p class="sub">行情样本${start}：${esc(h.nDaily??"—")} 个交易日，${esc(h.nWeekly??"—")} 根周线，${esc(h.nMonthly??"—")} 根月线，${esc(h.nQuarterly??"—")} 根季线。均线只使用这段样本。</p>`;
}
function card(it,prefix,withReason){
  const id=domId(prefix,it.ticker);
  const on=triggered(it);
  const unit=ccy(it.currency);
  const px=money(it.lastClose);
  const tags=[];
  tags.push(it.midTerm&&it.midTerm.triggered
    ?`<span class="tag on">中期 · 已触发 · ${esc(typeText(it.midTerm))}</span>`
    :`<span class="tag off">中期 · 未触发</span>`);
  tags.push(it.longTerm&&it.longTerm.triggered
    ?`<span class="tag on">长期 · 已触发 · ${esc(typeText(it.longTerm))}</span>`
    :`<span class="tag off">长期 · 未触发</span>`);
  if(!on)tags.push(`<span class="tag miss">本周没有买点</span>`);
  if(it.isPrivate)tags.push(`<span class="tag miss">未上市</span>`);
  const yahoo=it.yahooSymbol&&it.yahooSymbol!==it.ticker?` title="行情代码 ${esc(it.ticker)} / ${esc(it.yahooSymbol)}"`:"";
  const code=it.yahooSymbol&&it.yahooSymbol!==it.ticker?`${esc(it.ticker)}`:`${esc(it.ticker)}`;
  const lo=money(it.weekLow), hi=money(it.weekHigh);
  let week=`本周已交易 ${esc(it.weekBars==null?"—":it.weekBars)} 日`;
  if(lo&&hi)week+=`，区间 ${lo}–${hi} ${esc(unit)}`;
  if(it.lastCloseDate)week+=` · 收盘日 ${esc(it.lastCloseDate)}`;
  const trend=it.uptrend?"处于上升趋势":"未处于上升趋势";
  const trendNote=it.uptrendNote?`。${esc(it.uptrendNote)}`:"";
  const yahooNote=it.yahooSymbol&&it.yahooSymbol!==it.ticker?` · 行情代码 ${esc(it.yahooSymbol)}`:"";
  const reason=withReason?`<p class="sum"><b>推荐理由。</b> ${it.rationale?esc(it.rationale):"报告未写推荐理由。"}</p>`:"";
  return `<article class="card ${on?"hit":""}" id="${id}">
    <div class="top"><h3><span class="rank">${esc(it.rank==null?"":it.rank)}</span> ${esc(it.name)} <span class="chip"${yahoo}>${code}</span></h3>
    <div class="px">${px==null?"—":px} <span class="sub">${esc(unit)}</span></div></div>
    <div class="sub">${week}${yahooNote}</div>
    <div style="margin-top:8px">${tags.join("")}</div>
    <p class="sub" style="margin:2px 0 0">${trend}${trendNote}</p>
    ${listingBlock(it)}
    <p class="sum"><b>结论。</b> ${it.summary?esc(it.summary):"报告未写结论。"}</p>
    ${reason}
    ${maTable(it)}
    ${sampleLine(it)}
  </article>`;
}
function specialsParagraph(items){
  const rows=items.filter(it=>it.listingNote);
  if(!rows.length)return "";
  const text=rows.map(it=>{
    const n=it.listingNote;
    const insuff=(n.insufficientAverages||[]).map(k=>maName(it,k));
    return `${it.name}（代码 ${it.ticker}${n.listingDate?"，"+n.listingDate+" 上市":""}${insuff.length?"；"+insuff.join("、")+"历史不足":""}）`;
  }).join("、");
  return `<p>上市时间较短的标的仍按上市公司计入名单并排序。均线只用上市日（含）之后的行情；样本不够的均线写明历史不足，不拼接旧代码的历史，也不编造。本页不画价格走势图。本周适用：${esc(text)}。</p>`;
}
function render(data){
  const meta=data.meta||{};
  const user=sorted(data.userList);
  const rec=sorted(data.recommendedList);
  const note=meta.dataAsOfNote||"";
  const edition=meta.edition||"";
  const blob=edition+"\n"+note;
  const thanksgiving=/感恩节/.test(blob);
  const earlyClose=/提前收盘|提前于/.test(note);
  const notFinal=/非周五|非终稿|不是周五|最终周报/.test(blob);
  const asof=meta.dataAsOfTradingDate||"—";
  document.title="投资买点 · 截止 "+asof;
  const badge=$("badge");
  badge.textContent=thanksgiving?"感恩节周 · 非终稿":(notFinal?"非终稿":(edition||"周报"));
  const bits=["收盘","北京时间"];
  if(thanksgiving)bits.push("感恩节周");
  if(earlyClose)bits.push("周五提前收盘");
  if(notFinal)bits.push("非终稿");
  $("meta").innerHTML=`数据截止日 <b>${esc(asof)}</b> 收盘（北京时间）${edition?` · ${esc(edition)}`:""}`;

  const userHit=user.filter(triggered), recHit=rec.filter(triggered);
  const userMiss=user.filter(it=>!triggered(it)), recMiss=rec.filter(it=>!triggered(it));
  const userTick=new Set(user.map(it=>it.ticker));
  const overlap=rec.filter(it=>userTick.has(it.ticker));
  const th=(meta.methodology||{}).triggerThresholds||{};
  const band=esc(bandText(th.bandPct==null?2:th.bandPct));
  const noBuy=data.noBuyPointThisWeek||{};
  let hitIntro="本周触发的买点如下。";
  if(noBuy.overall===false&&(userHit.length||recHit.length))hitIntro="本周不是「没有买点」。触发的标的如下，点进去可以看均线和结论。";
  else if(!userHit.length&&!recHit.length)hitIntro="按本周 JSON，没有标的触发买点。";

  const meth=meta.methodology||{};
  const specials=[].concat(user,rec);
  const app=[
    `<div class="kpis">
      <div class="kpi"><div class="l">数据截止</div><div class="v">${esc(asof)}</div><div class="s">${esc(bits.join(" · "))}</div></div>
      <div class="kpi"><div class="l">用户名单有买点</div><div class="v">${userHit.length} / ${user.length}</div><div class="s">${userMiss.length} 个本周没有买点</div></div>
      <div class="kpi"><div class="l">推荐名单有买点</div><div class="v">${recHit.length} / ${rec.length}</div><div class="s">${recMiss.length} 个本周没有买点</div></div>
    </div>`,
    `<div class="card callout"><h2>数据截止与本周说明</h2><p>${esc(note||"报告未写截止说明。")}</p>${meta.generatedAtNote?`<p class="sub">${esc(meta.generatedAtNote)}</p>`:""}</div>`,
    `<div class="card"><h2>方法论</h2>
      <ul>
        <li><b>中期。</b>回调到向上的 26 周线；或处于上升趋势（收盘在 26 周线之上，且 26 周线向上）并接近 5 周线。</li>
        <li><b>长期。</b>向上的 5 月线、5 季线（约 15 个月）或 5 年线（月线 SMA60）。年线 SMA5 只作对照，不单独当作买点。</li>
        <li><b>阈值。</b>收盘距目标均线在 ±${band}% 以内，或本周最低价进入该均线上方 ${band}% 以内（含跌破）后收盘站稳。均线向下，或样本不足时，不记为买点。</li>
      </ul>
      <p class="sub">排序：中期与长期同时触发的在前，其次仅长期，再次仅中期，没有买点的标的排在后面，并且仍然显示。</p>
      <p>26 周线历史不够时，上升趋势改为：收盘在 5 月线之上且 5 月线向上，并在该标的下注明。</p>
      ${specialsParagraph(specials)}
      <details><summary>本周 JSON 里的完整口径</summary>
        ${meth.priceSeries?`<h3>价格</h3>${dl(meth.priceSeries)}`:""}
        ${meth.averages?`<h3>均线</h3>${dl(meth.averages)}`:""}
        ${meth.trendDefinitions?`<h3>趋势</h3>${dl(meth.trendDefinitions)}`:""}
        ${meth.triggerThresholds?`<h3>触发</h3>${dl(meth.triggerThresholds)}`:""}
        ${meth.ranking?`<h3>排序</h3>${dl(meth.ranking)}`:""}
        ${meth.spacexRule?`<h3>SPCX</h3>${dl(meth.spacexRule)}`:""}
      </details>
      ${(meta.sources&&meta.sources.length)?`<details><summary>数据来源</summary><ul>${meta.sources.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></details>`:""}
    </div>`,
    `<div class="card hit"><h2>本周触发的买点</h2><p>${hitIntro}</p>
      <div class="pills">${userHit.map(it=>pill(it,"user")).concat(recHit.map(it=>pill(it,"rec"))).join("")||'<span class="sub">无</span>'}</div>
      <h2 style="margin-top:14px">本周没有买点</h2>
      <p class="sub">这些标的本周没有触发，仍按各自名单的排序留在下面，不会被拿掉。</p>
      <div class="pills">${userMiss.map(it=>pill(it,"user")).concat(recMiss.map(it=>pill(it,"rec"))).join("")||'<span class="sub">无</span>'}</div>
    </div>`,
    `<h2 style="margin:18px 0 0">用户名单</h2><p class="sub">共 ${user.length} 个，按报告排序。${overlap.length?"":"与推荐名单没有重复的代码。"}</p>`,
    user.map(it=>card(it,"user",false)).join("")||'<div class="card">用户名单为空。</div>',
    `<h2 style="margin:18px 0 0">推荐名单</h2><p class="sub">共 ${rec.length} 个，排序规则与用户名单相同，每条另有推荐理由。</p>`,
    rec.map(it=>card(it,"rec",true)).join("")||'<div class="card">推荐名单为空。</div>'
  ];
  $("app").innerHTML=app.join("");
  const tz=meta.generatedAtTimeZone==="Asia/Shanghai"||!meta.generatedAtTimeZone?"北京时间":meta.generatedAtTimeZone;
  const gen=meta.generatedAt?`报告生成于 ${esc(meta.generatedAt)}（${esc(tz)}）。`:"";
  $("foot").innerHTML=`仅供研究参考，不构成投资建议。时间均为北京时间。<br>${esc(meta.disclaimer||"")}<br>${gen}<br><a href="report.json">本周 JSON</a>`;
}
function $(id){return document.getElementById(id)}
function fail(msg){
  $("app").innerHTML=`<div class="card">无法加载本周数据：${esc(msg)}</div>`;
  $("meta").textContent="数据没有载入。";
}
function boot(data){
  try{render(data)}catch(e){fail(e&&e.message?e.message:String(e))}
}
if(location.protocol==="file:"){
  const s=document.createElement("script");
  s.src="report.js";
  s.onload=function(){if(!window.BUY_POINTS_REPORT)fail("report.js 里没有数据");else boot(window.BUY_POINTS_REPORT)};
  s.onerror=function(){fail("找不到 report.js")};
  document.body.appendChild(s);
}else{
  fetch("report.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(boot).catch(e=>fail(e&&e.message?e.message:String(e)));
}
</script>
</body></html>
