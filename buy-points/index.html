<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投资买点</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mute:#6b7280;--line:#e5e7eb;--up:#0a8f4e;--dn:#d0342c;--acc:#2563eb;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--fg:#e6e9ef;--mute:#9aa3b2;--line:#2a303b;--up:#34c77b;--dn:#ff6b62;--acc:#6ea0ff;--chip:#1f2638}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:16px;margin:0 0 10px}h3{font-size:16px;margin:0;font-weight:600}
.sub{color:var(--mute);font-size:12.5px}.badge{display:inline-block;background:#f59e0b;color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;margin-left:6px;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card.callout{border-color:#f59e0b}.hit{border-color:var(--acc)}.card.insuff{border-color:#f59e0b}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--mute)}
.up{color:var(--up)}.dn{color:var(--dn)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mute);font-weight:500;background:var(--card)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(8),td:nth-child(8){text-align:left}
td.wrap{white-space:normal;text-align:left;min-width:160px}
table.sum th:nth-child(-n+4),table.sum td:nth-child(-n+4){text-align:left}
tr.hitrow td{background:var(--chip)}
tr.grp td{text-align:left;color:var(--mute);font-weight:600;background:transparent}
.tw a{color:var(--acc)}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;font-size:12px}
ul{margin:4px 0;padding-left:20px}li{margin:3px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank{display:inline-block;min-width:1.4em;color:var(--acc);font-variant-numeric:tabular-nums}
.px{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sum{margin:8px 0}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;margin:0 6px 6px 0;border:1px solid transparent;vertical-align:middle}
.tag.on{background:var(--acc);color:#fff}.tag.off{background:var(--chip);color:var(--fg);border-color:var(--line)}.tag.miss{background:#f59e0b;color:#fff}
.tag.close{background:var(--up);color:#fff}.tag.wick{background:#0f766e;color:#fff}
td .tag{margin:0}
.nearest{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:13.5px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--acc);color:#fff;text-decoration:none;font-size:13px;line-height:1.45}
.pill.off{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.pill.insuff{background:#f59e0b;color:#fff;border-color:#f59e0b}
a.pill:visited{color:#fff}a.pill.off:visited{color:var(--fg)}a.pill.insuff:visited{color:#fff}
article.card{scroll-margin-top:12px}
details{border-top:1px solid var(--line);padding:6px 0;margin-top:8px}summary{cursor:pointer}
figure.chart{margin:12px 0 0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
figure.chart img{display:block;width:100%;height:auto;background:#fff}
figure.chart figcaption{color:#374151;background:#fff;font-size:12px;padding:6px 10px 8px;line-height:1.45}
.foot{color:var(--mute);font-size:12px;text-align:center;margin:20px 0}
.foot a{color:var(--acc)}
.legend{margin:8px 0 0}.legend .tag{margin-bottom:0}
</style>
</head>
<body><div class="wrap">
<nav class="seg" id="sitetabs" style="margin:2px 0 10px"><a href="../index.html" style="display:inline-block;padding:3px 12px;border-radius:6px;font-size:13px;text-decoration:none;background:var(--card);color:var(--fg);border:1px solid var(--line)">美股</a> <a href="../ashare/index.html" style="display:inline-block;padding:3px 12px;border-radius:6px;font-size:13px;text-decoration:none;background:var(--card);color:var(--fg);border:1px solid var(--line)">A股</a> <a href="./index.html" style="display:inline-block;padding:3px 12px;border-radius:6px;font-size:13px;text-decoration:none;background:var(--acc);color:#fff;border:1px solid var(--acc)">投资买点</a></nav>
<script src="../assets/sitetabs.js"></script>
<h1>投资买点 <span class="badge" id="badge">周报</span></h1>
<div class="sub" id="meta">正在读取本周数据…</div>
<div id="app"></div>
<div class="foot" id="foot">仅供研究参考，不构成投资建议。时间均为北京时间。</div>
</div>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TRIG={
  close_within_2pct:{label:"收盘踩线",cls:"close"},
  week_tag_and_hold:{label:"周内接近后站稳",cls:"wick"}
};
const TF_ORDER=["weekly","monthly","quarterly","annual"];
const RULE_LABEL={monthly:"月线",weekly:"周线",quarterly:"季线",annual:"年线"};

function money(x){
  if(x==null||x==="")return null;
  const n=Number(x);
  if(!isFinite(n))return null;
  return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function ccy(code){return !code||code==="USD"?"美元":String(code)}
function bandText(b){
  const n=Number(b);
  if(!isFinite(n))return "2";
  return n%1===0?String(n):String(Math.round(n*10)/10);
}
function domId(prefix,ticker){return prefix+"-"+String(ticker).replace(/[^A-Za-z0-9_-]/g,"-")}
function sorted(list){
  return (list||[]).map((x,i)=>({x,i})).sort((a,b)=>{
    const ra=a.x.rank==null?1e9:Number(a.x.rank), rb=b.x.rank==null?1e9:Number(b.x.rank);
    return ra-rb||a.i-b.i;
  }).map(t=>t.x);
}
function insuff(it){
  return it.rankTier==="insufficient_history"||!(it.buyPoints&&it.buyPoints.length);
}
function triggered(it){return !!(it.triggeredThisWeek||(it.thisWeekTriggers&&it.thisWeekTriggers.length))}
function pct(x){
  if(x==null||x==="")return "—";
  const n=Number(x);
  if(!isFinite(n))return "—";
  const cls=n>0?"up":n<0?"dn":"";
  const text=(n>0?"+":"")+n.toFixed(2)+"%";
  return `<span class="${cls}">${text}</span>`;
}
function dirCell(rising){
  if(rising==null)return "—";
  return rising?'<span class="up">向上</span>':'<span class="dn">向下</span>';
}
function trigInfo(type){return TRIG[type]||null}
function selectedPoints(it){
  return (it.buyPoints||[]).filter(b=>b&&b.value!=null&&b.enoughHistory!==false&&b.distancePct!=null&&isFinite(Number(b.distancePct)));
}
function nearestPoint(it){
  const pts=selectedPoints(it).filter(b=>b.rising!==false);
  if(!pts.length)return null;
  return pts.slice().sort((a,b)=>Math.abs(Number(a.distancePct))-Math.abs(Number(b.distancePct)))[0];
}
function deepestTrigger(it){
  const pts=(it.buyPoints||[]).filter(b=>b.triggeredThisWeek);
  if(!pts.length)return null;
  return pts.slice().sort((a,b)=>(Number(b.depth)||0)-(Number(a.depth)||0)||Math.abs(Number(a.distancePct))-Math.abs(Number(b.distancePct)))[0];
}
function triggerKinds(it){
  const seen=[];
  (it.buyPoints||[]).forEach(b=>{
    if(b.triggeredThisWeek&&TRIG[b.triggerType]&&seen.indexOf(b.triggerType)<0)seen.push(b.triggerType);
  });
  return seen;
}
function statusCell(b){
  const info=b.triggeredThisWeek?trigInfo(b.triggerType):null;
  if(info)return `<span class="tag ${info.cls}" title="${esc(b.note||"")}">${info.label}</span>`;
  if(b.priorTagInPeriod)return `<span class="sub" title="${esc(b.note||"")}">期内曾接近，本周不计</span>`;
  if(b.rising===false)return `<span class="sub" title="${esc(b.note||"")}">均线向下，不计</span>`;
  return `<span class="sub" title="${esc(b.note||"")}">未触发</span>`;
}
function listPrefix(listName){return listName==="recommendedList"?"rec":"user"}
function pill(it,prefix){
  const id=domId(prefix,it.ticker);
  let cls="", text;
  if(insuff(it)){cls=" insuff";text="历史不足"}
  else if(triggered(it)){
    text=triggerKinds(it).map(k=>TRIG[k].label).join(" · ")||"本周已触发";
  }else{cls=" off";text="本周没有买点"}
  const label=esc((it.rank==null?"":it.rank+" ")+it.name+" "+it.ticker)+" · "+esc(text);
  return `<a class="pill${cls}" href="#${id}">${label}</a>`;
}
function nearestBlock(it){
  if(insuff(it))return `<div class="nearest">距最近选定买点：暂无。上市时间不够，周线、月线、季线和年线买点都历史不足。</div>`;
  const n=nearestPoint(it);
  if(!n)return `<div class="nearest">距最近选定买点：报告没有给出可用的向上均线。</div>`;
  const info=n.triggeredThisWeek?trigInfo(n.triggerType):null;
  let html=`距最近选定买点 <b>${esc(n.depthLabel)}（${esc(n.maName)}）</b> ${pct(n.distancePct)}`;
  if(info)html+=`，${esc(info.label)}`;
  const deep=deepestTrigger(it);
  if(deep&&deep.maName!==n.maName){
    const dinfo=trigInfo(deep.triggerType);
    html+=`。本周更深的一档是 <b>${esc(deep.depthLabel)}（${esc(deep.maName)}）</b>，收盘距离 ${pct(deep.distancePct)}`;
    if(dinfo)html+=`，${esc(dinfo.label)}`;
  }
  return `<div class="nearest">${html}。</div>`;
}
function layerNote(it){
  if(insuff(it))return "";
  const yahoo=it.yahooSymbol||it.ticker;
  if(it.ticker==="BRK.B"||yahoo==="BRK-B")return `<p class="sub">分层校准标的。月线 30 / 60 / 125，周线 125，季线 SMA10 为第一买点、SMA30 为第三买点，年线 SMA5 / SMA10。季线第二买点没有采用。</p>`;
  if(it.sameLengthsAsBerkshireButIndependentlySupported)return `<p class="sub">均线长度与伯克希尔校准分层相同，依据是该股自己的历史回踩。</p>`;
  return `<p class="sub">分层按该股自己的图选定，不套用伯克希尔的全部均线。</p>`;
}
function maTable(it){
  const pts=it.buyPoints||[];
  if(!pts.length)return `<p class="sub">没有选定的买点均线。</p>`;
  const unit=ccy(it.currency);
  let rows="", lastTf="";
  pts.forEach(b=>{
    const tf=b.timeframe||"";
    if(tf!==lastTf){
      lastTf=tf;
      const label=b.timeframeZh||tf;
      rows+=`<tr class="grp"><td colspan="8">${esc(label)}</td></tr>`;
    }
    let name=esc(b.maName||"");
    if(b.timeframe==="quarterly"&&Number(b.depth)===2)name+=` <span class="tag off">看图得出</span>`;
    const touches=b.historicalTouches==null?"—":esc(b.historicalTouches)+" 次";
    rows+=`<tr class="${b.triggeredThisWeek?"hitrow":""}"><td>${esc(b.depthLabel||"")}</td><td>${name}</td><td>${esc(money(b.value))}</td><td>${dirCell(b.rising)}</td><td>${pct(b.distancePct)}</td><td>${pct(b.weekLowDistPct)}</td><td>${touches}</td><td>${statusCell(b)}</td></tr>`;
  });
  const chartNote=pts.some(b=>b.timeframe==="quarterly"&&Number(b.depth)===2)
    ?"季线上的「看图得出」表示第二买点来自该股自己的图，不是伯克希尔分层里的一档。"
    :"";
  return `<div class="tw"><table><tr><th>深度</th><th>均线</th><th>数值（${esc(unit)}）</th><th>方向</th><th>收盘距离</th><th>本周最低距离</th><th>历史回踩</th><th>本周</th></tr>${rows}</table></div><p class="sub">距离 = 收盘或本周最低价相对该均线的百分比，正数表示价格在均线之上。标成触发的是本周买点。${chartNote}</p>`;
}
function historyDetails(it){
  const pts=(it.buyPoints||[]).filter(b=>(b.historicalExamples||[]).length);
  if(!pts.length)return "";
  const blocks=pts.map(b=>{
    const dates=(b.historicalExamples||[]).slice(0,6).map(ex=>{
      const d=ex.trough_date||ex.date||"";
      const dist=ex.min_dist_pct;
      const extra=dist==null?"":`（距该线 ${Number(dist)>0?"+":""}${Number(dist).toFixed(1)}%）`;
      return esc(d)+extra;
    }).join("、");
    return `<li><b>${esc(b.depthLabel)} · ${esc(b.maName)}。</b> ${dates}</li>`;
  }).join("");
  return `<details><summary>历史回踩日期</summary><ul>${blocks}</ul><p class="sub">日期是该均线附近曾经出现过的低点，用来说明这条线为什么被选进该股的买点，不表示未来会在同一位置获得支撑。</p></details>`;
}
function chartBlock(it){
  const charts=(it.charts||[]).filter(p=>/_selected\.png$/i.test(String(p)));
  if(!charts.length)return "";
  const src=String(charts[0]).replace(/^\//,"");
  const alt=esc(it.name)+"（"+esc(it.ticker)+"）选定买点均线，含周线、月线、季线和年线";
  return `<figure class="chart"><img src="${esc(src)}" width="2080" height="1300" alt="${alt}" loading="lazy" decoding="async"><figcaption>${esc(it.name)}（${esc(it.ticker)}）选定买点均线。四张小图依次是周线、月线、季线、年线，曲线为复权收益和该股自己采用的均线。</figcaption></figure>`;
}
function sampleLine(it){
  const h=it.history;
  if(!h)return "";
  const start=h.firstDateUsed?`自 ${esc(h.firstDateUsed)} 起`:"";
  const yearly=h.nYearly==null?"":`，${esc(h.nYearly)} 根年线`;
  return `<p class="sub">行情样本${start}：${esc(h.nDaily??"—")} 个交易日，${esc(h.nWeekly??"—")} 根周线，${esc(h.nMonthly??"—")} 根月线，${esc(h.nQuarterly??"—")} 根季线${yearly}。均线只使用这段样本。</p>`;
}
function insuffCallout(it){
  if(!insuff(it))return "";
  const start=it.history&&it.history.firstDateUsed?esc(it.history.firstDateUsed):"上市日";
  return `<div class="card callout" style="margin:10px 0"><b>历史不足，暂不给出买点。</b> ${esc(it.name)}（代码 ${esc(it.ticker)}）只使用 ${start} 及之后的公开行情，不混用旧代码或上市前数据。周线、月线、季线和年线的长周期均线样本都不够，不用 5 周线代替。</div>`;
}
function card(it,prefix){
  const id=domId(prefix,it.ticker);
  const on=triggered(it);
  const unit=ccy(it.currency);
  const px=money(it.lastClose);
  const tags=[];
  if(insuff(it))tags.push(`<div><span class="tag miss">历史不足</span></div>`);
  else if(!on)tags.push(`<div><span class="tag off">本周没有买点</span></div>`);
  triggerKinds(it).forEach(k=>{
    const names=(it.buyPoints||[]).filter(b=>b.triggeredThisWeek&&b.triggerType===k).map(b=>b.depthLabel+" · "+b.maName).join("、");
    tags.push(`<div><span class="tag ${TRIG[k].cls}">${TRIG[k].label}</span><span class="sub">${esc(names)}</span></div>`);
  });
  if(it.isPrivate)tags.push(`<span class="tag miss">未上市</span>`);
  const code=esc(it.ticker);
  const yahooTitle=it.yahooSymbol&&it.yahooSymbol!==it.ticker?` title="行情代码 ${esc(it.yahooSymbol)}"`:"";
  const lo=money(it.weekLow);
  let week=`本周已交易区间`;
  if(lo)week=`本周最低 ${lo} ${esc(unit)}`;
  if(it.lastCloseDate)week+=` · 收盘日 ${esc(it.lastCloseDate)}`;
  const yahooNote=it.yahooSymbol&&it.yahooSymbol!==it.ticker?` · 行情代码 ${esc(it.yahooSymbol)}`:"";
  const cls=insuff(it)?"insuff":(on?"hit":"");
  return `<article class="card ${cls}" id="${id}">
    <div class="top"><h3><span class="rank">${esc(it.rank==null?"":it.rank)}</span> ${esc(it.name)} <span class="chip"${yahooTitle}>${code}</span></h3>
    <div class="px">${px==null?"—":px} <span class="sub">${esc(unit)}</span></div></div>
    <div class="sub">${week}${yahooNote}</div>
    <div style="margin-top:8px">${tags.join("")}</div>
    ${insuffCallout(it)}
    ${nearestBlock(it)}
    ${layerNote(it)}
    <p class="sum"><b>本周结论。</b> ${it.summary?esc(it.summary):"报告未写结论。"}</p>
    <p class="sum"><b>看图依据。</b> ${it.buyPointSelectionRationale?esc(it.buyPointSelectionRationale):"报告未写看图依据。"}</p>
    ${maTable(it)}
    ${chartBlock(it)}
    ${sampleLine(it)}
    ${historyDetails(it)}
  </article>`;
}
function ruleList(rule){
  if(!rule||typeof rule!=="object")return "";
  return "<ul>"+Object.keys(RULE_LABEL).filter(k=>rule[k]).map(k=>`<li><b>${RULE_LABEL[k]}。</b> ${esc(rule[k])}</li>`).join("")+"</ul>";
}
function triggerTable(rows){
  if(!rows||!rows.length)return `<p class="sub">无</p>`;
  const body=rows.map(t=>{
    const id=domId(listPrefix(t.list),t.ticker);
    const info=trigInfo(t.triggerType)||{label:t.triggerType||"—",cls:"off"};
    const listName=t.list==="recommendedList"?"推荐名单":"用户名单";
    return `<tr class="hitrow"><td>${listName}</td><td><a href="#${id}">${esc(t.name)} ${esc(t.ticker)}</a></td><td class="wrap">${esc(t.depthLabel)} · ${esc(t.maName)}</td><td><span class="tag ${info.cls}">${esc(info.label)}</span></td><td>${pct(t.distancePct)}</td></tr>`;
  }).join("");
  return `<div class="tw"><table class="sum"><tr><th>名单</th><th>标的</th><th>买点</th><th>触发方式</th><th>收盘距离</th></tr>${body}</table></div>`;
}
function countCloseNames(items){
  let close=0, wickOnly=0;
  items.forEach(it=>{
    const kinds=triggerKinds(it);
    if(kinds.indexOf("close_within_2pct")>=0)close++;
    else if(kinds.indexOf("week_tag_and_hold")>=0)wickOnly++;
  });
  return {close,wickOnly};
}
function render(data){
  const meta=data.meta||{};
  const user=sorted(data.userList);
  const rec=sorted(data.recommendedList);
  const note=meta.dataAsOfNote||"";
  const genNote=meta.generatedAtNote||"";
  const edition=meta.edition||"";
  const blob=[edition,note,genNote].join("\n");
  const thanksgiving=/感恩节/.test(blob);
  const earlyClose=/提前收盘|提前于/.test(blob);
  const notFinal=/非终稿|非周五收盘|不是周五收盘后/.test(blob);
  const asof=meta.dataAsOfTradingDate||"—";
  document.title="投资买点 · 截止 "+asof;
  const badge=$("badge");
  const badgeBits=[];
  if(thanksgiving)badgeBits.push("感恩节周");
  if(earlyClose)badgeBits.push("周五提前收盘");
  if(notFinal)badgeBits.push("非终稿");
  badge.textContent=badgeBits.join(" · ")||(edition||"周报");
  const bits=["收盘","北京时间"];
  if(thanksgiving)bits.push("感恩节周");
  if(earlyClose)bits.push("周五提前收盘");
  if(notFinal)bits.push("非终稿");
  $("meta").innerHTML=`数据截止日 <b>${esc(asof)}</b> 收盘（北京时间） · 按各股自身均线看图`;

  const userHit=user.filter(triggered), recHit=rec.filter(triggered);
  const userMiss=user.filter(it=>!triggered(it)), recMiss=rec.filter(it=>!triggered(it));
  const counts=countCloseNames(user.concat(rec));
  const meth=meta.methodology||{};
  const cal=meta.berkshireCalibration||{};
  const th=meth.triggerThresholds||{};
  const band=esc(bandText(th.bandPct==null?2:th.bandPct));
  const title=meta.title?`<p><b>${esc(meta.title)}。</b></p>`:"";

  const app=[
    `<div class="kpis">
      <div class="kpi"><div class="l">数据截止</div><div class="v">${esc(asof)}</div><div class="s">${esc(bits.join(" · "))}</div></div>
      <div class="kpi"><div class="l">用户名单有买点</div><div class="v">${userHit.length} / ${user.length}</div><div class="s">${esc(userHit.map(it=>it.ticker).join("、")||"无")}</div></div>
      <div class="kpi"><div class="l">推荐名单有买点</div><div class="v">${recHit.length} / ${rec.length}</div><div class="s">${esc(recHit.map(it=>it.ticker).join("、")||"无")}</div></div>
      <div class="kpi"><div class="l">收盘踩线</div><div class="v">${counts.close}</div><div class="s">另有 ${counts.wickOnly} 只是周内接近后站稳</div></div>
    </div>`,
    `<div class="card callout"><h2>数据截止与本周说明</h2>
      ${title}
      ${edition?`<p>${esc(edition)}</p>`:""}
      <p>${esc(note||"报告未写截止说明。")}</p>
      ${genNote?`<p class="sub">${esc(genNote)}</p>`:""}
    </div>`,
    `<div class="card"><h2>方法论</h2>
      <p>买点从各公司自己的周线、月线、季线、年线图上选定。先用伯克希尔校准分层，再看其余公司：只有该股自己的历史上，价格至少一次在这条均线附近获得支撑，才采用它。深度表示更深、更长周期的买点。第一买点是较常见的回踩，第二、第三买点要到更深的调整才出现。</p>
      <p><b>伯克希尔校准。</b> ${esc(cal.current||"")}</p>
      ${ruleList(cal.userRule)}
      <p><b>本周怎样算触发。</b> 均线要向上。收盘距该股自己的买点均线在 ±${band}% 以内，记为收盘踩线；本周最低价进入或吞破该带，且收盘不低于均线下方 ${band}%，记为周内接近后站稳。本月、本季或本年更早触过、但本周收盘已经离开该带的，只作背景，不算本周买点。</p>
      <p class="legend"><span class="tag close">收盘踩线</span><span class="tag wick">周内接近后站稳</span></p>
      ${meth.fiveWeekRule?`<p><b>${esc(meth.fiveWeekRule)}</b></p>`:""}
      ${meth.ranking?`<p class="sub">排序。${esc(meth.ranking)}</p>`:""}
      ${meth.spacexRule?`<p class="sub">SpaceX。${esc(meth.spacexRule)}</p>`:""}
      <details><summary>看图核对与计算口径</summary>
        ${meth.perStockSelection?`<p>${esc(meth.perStockSelection)}</p>`:""}
        ${cal.operationalDefinition?`<p>${esc(cal.operationalDefinition)}</p>`:""}
        ${cal.chartConfirmation?`<p>${esc(cal.chartConfirmation)}</p>`:""}
        ${meth.priceSeries?`<p>${esc(meth.priceSeries)}</p>`:""}
        ${th.thisWeek?`<p>${esc(th.thisWeek)}</p>`:""}
        ${th.notCounted?`<p>${esc(th.notCounted)}</p>`:""}
        ${(meta.sources&&meta.sources.length)?`<ul>${meta.sources.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
      </details>
    </div>`,
    `<div class="card hit"><h2>本周触发的买点</h2>
      <p>用户名单里本周触发的是 ${esc(userHit.map(it=>it.name).join("、")||"无")}；推荐名单里是 ${esc(recHit.map(it=>it.name).join("、")||"无")}。下表把收盘踩线和周内接近后站稳分开。</p>
      ${triggerTable(data.thisWeekTriggers)}
      <p class="sub">收盘距离是相对该线的百分比，正数表示收盘在均线之上。周内接近后站稳的标的，收盘可能已经离开 ±${band}% 带。</p>
      <h2 style="margin-top:14px">本周没有买点</h2>
      <p class="sub">这些标的本周没有触发，仍按各自名单的排序留在下面。历史不足的标的单独标出，不硬算长周期均线。</p>
      <div class="pills">${userMiss.map(it=>pill(it,"user")).concat(recMiss.map(it=>pill(it,"rec"))).join("")||'<span class="sub">无</span>'}</div>
    </div>`,
    `<h2 style="margin:18px 0 0">用户名单</h2><p class="sub">共 ${user.length} 个，按报告排序。本周触发的在前，更深的买点更靠前；没有买点的按距离最近选定买点排序；历史不足的在最后。</p>
      <div class="pills" style="margin:8px 0">${user.map(it=>pill(it,"user")).join("")}</div>`,
    user.map(it=>card(it,"user")).join("")||'<div class="card">用户名单为空。</div>',
    `<h2 style="margin:18px 0 0">推荐名单</h2><p class="sub">共 ${rec.length} 个，排序规则与用户名单相同。每条都写了该股自己的看图依据。</p>
      <div class="pills" style="margin:8px 0">${rec.map(it=>pill(it,"rec")).join("")}</div>`,
    rec.map(it=>card(it,"rec")).join("")||'<div class="card">推荐名单为空。</div>'
  ];
  $("app").innerHTML=app.join("");
  const tz=meta.generatedAtTimeZone==="Asia/Shanghai"||!meta.generatedAtTimeZone?"北京时间":meta.generatedAtTimeZone;
  const gen=meta.generatedAt?`报告生成于 ${esc(meta.generatedAt)}（${esc(tz)}）。`:"";
  $("foot").innerHTML=`仅供研究参考，不构成投资建议。时间均为北京时间。<br>${esc(meta.disclaimer||"")}<br>${gen}<br><a href="report.json">本周 JSON</a>`;
}
function $(id){return document.getElementById(id)}
function fail(msg){
  $("app").innerHTML=`<div class="card">无法加载本周数据：${esc(msg)}</div>`;
  $("meta").textContent="数据没有载入。";
}
function boot(data){
  try{render(data)}catch(e){fail(e&&e.message?e.message:String(e))}
}
if(location.protocol==="file:"){
  const s=document.createElement("script");
  s.src="report.js";
  s.onload=function(){if(!window.BUY_POINTS_REPORT)fail("report.js 里没有数据");else boot(window.BUY_POINTS_REPORT)};
  s.onerror=function(){fail("找不到 report.js")};
  document.body.appendChild(s);
}else{
  fetch("report.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(boot).catch(e=>fail(e&&e.message?e.message:String(e)));
}
</script>
</body></html>
