// groups
$('groups').innerHTML='<tr><th>板块</th><th>多头</th><th>空头</th><th>净敞口</th><th>净占比</th><th>浮动盈亏</th><th>已实现</th><th>当日盈亏</th><th>持仓数</th></tr>'+
 D.groups.filter(g=>g[9]||g[7]).map(g=>`<tr><td>${g[1]}</td><td>${f0(g[2])}</td><td>${f0(g[3])}</td><td>${f0(g[4])}</td><td>${pc(g[5])}</td><td>${pn(g[6])}</td><td>${pn(g[7])}</td><td>${pn(g[8])}</td><td>${g[9]}</td></tr>`).join('');
// positions
const PC=[['标的',1,'s'],['方向',2,'s'],['数量',3],['均价',4],['现价',5],['市值',6],['占比',10],['浮动盈亏',7],['浮盈%',8],['当日盈亏',9],['板块',11,'s']];
let sk=10,sd=-1,gsel='all';
const gs=['all',...new Set(D.pos.map(p=>p[11]))];
$('gf').innerHTML=gs.map(g=>`<button data-g="${g}" class="${g==='all'?'on':''}">${g==='all'?'全部':GZ[g]||g}</button>`).join('');
document.querySelectorAll('#gf button').forEach(b=>b.onclick=()=>{gsel=b.dataset.g;document.querySelectorAll('#gf button').forEach(x=>x.classList.toggle('on',x===b));drawP()});
function drawP(){let r=D.pos.filter(p=>gsel==='all'||p[11]===gsel);
 r.sort((x,y)=>{let u=x[sk],v=y[sk];if(sk===10||sk===6){u=Math.abs(u);v=Math.abs(v)}return (typeof u==='string'?u.localeCompare(v):(u-v))*sd});
 const mw=Math.max(...D.pos.map(p=>Math.abs(p[10])));
 $('poscount').textContent=`共 ${D.pos.length} 个`;
 $('pos').innerHTML='<tr>'+PC.map(c=>`<th class="s" data-k="${c[1]}">${c[0]}${sk===c[1]?(sd>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>'+
 r.map(p=>`<tr><td>${p[1]}${p[12]?' <span class="chip">期权</span>':''}</td><td class="${p[2]==='short'?'dn':'up'}">${p[2]==='short'?'空':'多'}</td><td>${f0(p[3])}</td><td>${f2(p[4])}</td><td>${f2(p[5])}</td><td>${f0(p[6])}</td>`+
 `<td><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end">${pc(Math.abs(p[10])).replace('+','')}<div class="bar" style="width:60px"><i style="width:${Math.abs(p[10])/mw*100}%;background:${p[10]<0?'var(--dn)':'var(--up)'}"></i></div></div></td>`+
 `<td>${pn(p[7])}</td><td>${pn(p[8]==null?null:p[8]*100,x=>x.toFixed(1)+'%')}</td><td>${pn(p[9])}</td><td>${GZ[p[11]]||p[11]}</td></tr>`).join('');
 document.querySelectorAll('#pos th.s').forEach(t=>t.onclick=()=>{const k=+t.dataset.k;if(k===sk)sd=-sd;else{sk=k;sd=(k===1||k===2||k===11)?1:-1}drawP()})}
drawP();
// realized
const rt=D.real.reduce((s,r)=>s+r[4],0),rd=D.real.reduce((s,r)=>s+(r[5]||0),0);
$('realsum').innerHTML=`合计 ${pn(rt)}，其中当日 ${pn(rd)}（FIFO 口径）`;
$('real').innerHTML='<tr><th>标的</th><th>状态</th><th>板块</th><th>已平数量</th><th>已实现（累计）</th><th>当日已实现</th></tr>'+
 D.real.slice().sort((x,y)=>x[4]-y[4]).map(r=>`<tr><td>${r[0]}</td><td><span class="chip">${r[2]}</span></td><td>${GZ[r[1]]||r[1]}</td><td>${f0(r[3])}</td><td>${pn(r[4])}</td><td>${r[5]?pn(r[5]):'—'}</td></tr>`).join('');
// trades
const t=D.tsum;$('tsum').textContent=`${t.n_orders} 笔委托 / ${t.n_fills} 次成交 · 成交额 $${f0(t.turnover)}`;
$('trades').innerHTML='<tr><th>时间</th><th>标的</th><th>操作</th><th>数量</th><th>均价</th><th>金额</th><th>已实现</th><th class="l">原因</th></tr>'+
 D.trades.map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td><td>${o[2]}</td><td>${f0(o[3])}</td><td>${f2(o[4])}</td><td>${f0(o[5])}</td><td>${o[6]==null?'—':pn(o[6])}</td><td class="reason">${o[7]||''}</td></tr>`).join('');
</script>
</body></html>
